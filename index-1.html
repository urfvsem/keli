<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE YOU KELI ❤️</title>

<style>

body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial,sans-serif;
}

canvas{
    position:absolute;
    top:0;
    left:0;
}

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:60px;
    font-weight:bold;
    text-shadow:
        0 0 10px #ff3366,
        0 0 20px #ff3366,
        0 0 40px #ff3366;
    pointer-events:none;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="centerText">
LOVEDYOU KELI COMEL ❤️
</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();

window.addEventListener("resize", resize);

let particles = [];

for(let i=0;i<1200;i++){

    let t = Math.random()*Math.PI*2;

    particles.push({
        t:t,
        size:10 + Math.random()*8,
        offset:Math.random()*20
    });

}

function draw(){

    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    let pulse = 18 + Math.sin(Date.now()/400)*3;

    particles.forEach(p=>{

        let x =
        16*Math.pow(Math.sin(p.t),3);

        let y =
        13*Math.cos(p.t)
        -5*Math.cos(2*p.t)
        -2*Math.cos(3*p.t)
        -Math.cos(4*p.t);

        let px =
        canvas.width/2 +
        x*(pulse+p.offset);

        let py =
        canvas.height/2 -
        y*(pulse+p.offset);

        let alpha =
        0.5 + 0.5*Math.sin(Date.now()/300+p.offset);

        ctx.fillStyle=
        `rgba(255,60,100,${alpha})`;

        ctx.font=
        p.size+"px Arial";

        ctx.fillText(
        "LOVE YOU AQEEL",
        px,
        py
        );

    });

    requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
