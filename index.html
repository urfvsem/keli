<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>I Loved You Aqeel</title>

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
}

.heart{
    position:relative;
    width:600px;
    height:550px;
}

.word{
    position:absolute;
    color:#ff3333;
    text-shadow:
        0 0 5px red,
        0 0 10px red,
        0 0 20px red,
        0 0 40px red;
    animation:pulse 2s infinite;
    font-size:16px;
    white-space:nowrap;
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:70px;
    font-weight:bold;
    color:white;
    text-shadow:
        0 0 10px red,
        0 0 20px red,
        0 0 40px red,
        0 0 80px red;
    animation:glow 1.5s infinite alternate;
}

@keyframes pulse{
    0%{opacity:0.5;}
    50%{opacity:1;}
    100%{opacity:0.5;}
}

@keyframes glow{
    from{
        transform:translate(-50%,-50%) scale(1);
    }
    to{
        transform:translate(-50%,-50%) scale(1.08);
    }
}
</style>
</head>

<body>

<div class="heart" id="heart">
    <div class="center">I LOVED YOU AQEEL ❤️</div>
</div>

<script>
const heart = document.getElementById("heart");

for(let i=0;i<250;i++){

    let t = Math.random()*Math.PI*2;

    let x = 16*Math.pow(Math.sin(t),3);
    let y = 13*Math.cos(t)
          -5*Math.cos(2*t)
          -2*Math.cos(3*t)
          -Math.cos(4*t);

    x = x*20 + 300;
    y = -y*20 + 250;

    let word = document.createElement("div");
    word.className = "word";
    word.innerHTML = "I LOVED YOU AQEEL";

    word.style.left = x + "px";
    word.style.top = y + "px";

    word.style.fontSize =
        (10 + Math.random()*12) + "px";

    word.style.animationDelay =
        (Math.random()*2) + "s";

    heart.appendChild(word);
}
</script>

</body>
</html>
